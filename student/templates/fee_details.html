<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
        }
        
        .header {
            background: #2c3e50;
            color: white;
            padding: 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .header h2 {
            font-size: 22px;
        }
        
        .stu-name {
            font-size: 16px;
        }
        
        .container {
            display: flex;
            min-height: calc(100vh-64px);
        }
        
        .sidebar {
            width: 210px;
            background-color: white;
            border-right: 1px solid #ddd;
            padding-top: 20px;
            height: 550px;
        }
        
        .sidebar a {
            display: block;
            padding: 13px 20px;
            text-decoration: none;
            color: #333
        }
        
        .sidebar a:hover {
            background-color: #eee;
        }
        
        .main {
            flex: 1;
            padding: 30px;
        }
        
        .card {
            width: 600px;
            margin: 40px auto;
            background-color: #ddd;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        table td {
            padding: 12px;
            border: 1px solid #ddd;
        }
        
        h2 {
            text-align: center;
        }
        
        .btn {
            display: inline-block;
            text-decoration: none;
            background-color: #28a745;
            color: #ddd;
            padding: 12px 25px;
            border-radius: 5px;
            margin-top: 20px;
            position: relative;
            left: 30%;
        }
    </style>



</head>

<body>
    <!--header-->
    <div class="header">
        <h2>Student Portal</h2>
        <div class="stu-name">{{stu.username}}</div>

    </div>

    <!--container-->

    <div class="container">

        <!---side bar-->
        <div class="sidebar">
            <a href="{% url 'show_profile' %}">My Profile</a>
            <a href="">Fee details</a>
            <a href="">Change Password</a>
            <a href="">Logout</a>
        </div>

        <!---main content-->
        <div class="card">
            <table>
                <tr>
                    <td><b>Student name<b></b></b>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td><b>Course<b></td>
            </tr>
            <tr>
                <td><b>Tootal fee<b></td>
                <td> {{stu.Total_fee}}</td>
            </tr>
            <tr>
                <td><b>Paid fee<b></td>
                <td></td>
            </tr>
            <tr>
                <td><b>Remaining Fee<b></b></b>
                    </td>
                    <td></td>
                </tr>
                <tr>
                    <td></td>
                </tr>
            </table>
            <a href="">Download Reciept.</a>
        </div>



    </div>



    </div>
    </div>





</body>

</html>
