<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Show Profile</title>
 <style>

     *{

        margin: 0;
        padding:0;
        box-sizing: border-box;
        font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
     }

     body{
        background-color: #f5f5f5;
     }
     .header{

        background: #2c3e50;
        color:white;
        padding:20px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
     }
     .header h2{
        font-size: 22px;
     }
     .stu-name{
        font-size: 16px;
     }
     .container{
        display: flex;
        min-height: calc(100vh-64px);
     }
     .sidebar{
       width: 210px;
       background-color: white;
       border-right: 1px solid #ddd;
       padding-top: 20px;
       height: 550px;

     }

     .sidebar a{
        display: block;
        padding:13px 20px ;
        text-decoration: none;
        color:#333
     }
     .sidebar a:hover{
        background-color: #eee;
     }
     .main{
        flex: 1;
        padding: 30px;
     }
     .main h1{

        color:#333;
        margin-bottom: 8px;
     }
     .main  p{

        color:#666;
        margin-bottom: 25px;

     }
     .cards{
        display: flex;
        gap:20px;
        flex-wrap: wrap;
     }

     .card{
        background-color: white;
        width: 250px;
        padding:20px;
        border:1px solid #ddd;
        border-radius: 6px;

     }
       .card h3{

        color:#333;
        margin-bottom: 10px;

       }

       .card p{

        font-size: 14px;
        margin-bottom: 15px;
       }
       .btn{
        display: inline-block;
        background-color: #3498db;
        color:white;
        padding:8px 15px;
        border-radius: 4px;
        text-decoration: none;
        font-size: 14px;

       }
       .main{
        flex: 1;
        padding: 30px;
       }
       .main h1{
        color:#333;
        margin-bottom: 8px;

       }
       .main p{
        color:#666;
        margin-bottom: 25px;
       }
       .form-box{
        background-color: white;
        max-width: 700px;
        padding: 25px;
        border: 1px solid #ddd;
        border-radius: 6px;
       }

       .form-box label{
         display: block;
         color:#333;
         margin-bottom: 7px;
         font-size: 14px;
       }
       .form-box input{
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        font-size: 14px;
        outline: none;
        border: 1px solid #ccc;
        border-radius: 4px;

       }

        

       .stu-image{
        width: 100px;
        height: 100px;
       
        object-fit: cover;
        border-radius: 50%;
        border: 2px solid #3498db;
        position: relative;
        left: 300px;

       }
       .image-box{
    
        margin-bottom: 25px;
       }



    </style>



</head>
<body>
    <!--header-->
    <div class="header">
        <h2>Student Portal</h2>
        <div class="stu-name">{{stu.username}}</div>

    </div>

    <!--container-->

    <div class="container">

        <!---side bar-->
        <div class="sidebar">
            <a href="{% url 'show_profile' %}">My Profile</a>
            <a href="">Fee details</a>
            <a href="">Change Password</a>
            <a href="">Logout</a>
        </div>

        <!---main content-->
        <div class="main">
        <h1>Edit Student Profile</h1>
        <p>Update your personal information</p>
        <div class="form-box">

            <form method="post" enctype="multipart/form-data">
                {% csrf_token %}
                <div class="image-box">
                  {% if stu.image %}

                    <img src="{{ stu.image.url }}"  class="stu-image">


                 

                </div>

                {% endif %}

                   <input type="file" name="image">


                <div class="form-group">
                    <label>Name</label>
                    <input type="text" value="{{ stu.name }}" required name="name">
                </div>

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" value="{{stu.username}}" required disabled>
                </div>


                <div class="form-group">
                    <label>Email</label>
                    <input type="text" value="{{stu.email}}" required name="email">


                    <label>Phone</label>
                    <input type="text" value="{{stu.phone}}" required name="phone">
                    

                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" value="{{stu.city}}" required name="city">
                </div>
                <br>

                <input type="submit" class="btn" value="Update Profile">

            </form>




        </div>
       


    </div>
    </div>




    
</body>
</html>
