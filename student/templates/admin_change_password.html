<!DOCTYPE html>
<html>
<head>
    <title>Change Password</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f5f7;
        }

        .container {
            width: 400px;
            margin: 80px auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        h2 {
            text-align: center;
            color: #222;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 11px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            border-color: #2196f3;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background: #2196f3;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1976d2;
        }

        .message {
            text-align: center;
            margin-bottom: 15px;
            color: green;
        }

        .error {
            color: red;
            text-align: center;
            margin-bottom: 15px;
        }

        .back-btn{
            display: block;
            width: fit-content;
            margin: 20px auto;
            padding: 12px 25px;
            background: #2196f3;
            color: bisque;
            text-decoration: none;
            border-radius: 25px;
            font-weight: bold;
        }
        .back-btn:hover{
            background: #1976d2;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Change Password</h2>

    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <form method="POST" onsubmit="return check_password()">
        {% csrf_token %}

        <label>Old Password</label>
        <input type="password" name="old_password" required>

        <label>New Password</label>
        <input type="password" name="new_password" required id="np">

        <label>Confirm New Password</label>
        <input type="password" name="confirm_password" required id="cp">

        <button type="submit">Change Password</button>
    </form>

    <a href="{% url 'adminhome' %}" class="back-btn">← Back to Dashboard</a>

</div>
<script>
    function check_password(){
        np=document.getElementById('np').value
        cp=document.getElementById('cp').value
        if(np!=cp){
            alert("Password and Confirm password not match")
            return false
        }
        return true
    }
</script>

</body>
</html>
